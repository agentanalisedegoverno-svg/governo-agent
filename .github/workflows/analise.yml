name: Analise automatizada de licitacao

on:
  push:
    branches: [main]
    paths: ["casos/**"]
  workflow_dispatch:
    inputs:
      caso:
        description: "ID do processo (nome da pasta em casos/)"
        required: true
      prompt:
        description: "ID do prompt (ver prompts/index.json)"
        required: true
      documento:
        description: "Arquivo especifico dentro do caso (opcional, usado por prompts sem gatilho fixo)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Detectar arquivos alterados
        id: alterados
        if: github.event_name != 'workflow_dispatch'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            arquivos=$(git show --name-only --pretty="" HEAD)
          else
            arquivos=$(git diff --name-only "$before" "${{ github.sha }}")
          fi
          echo "arquivos<<EOF" >> "$GITHUB_OUTPUT"
          echo "$arquivos" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Executar analises (arquivos alterados)
        if: github.event_name != 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m agente.executar --arquivos "${{ steps.alterados.outputs.arquivos }}"

      - name: Executar analise manual
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m agente.executar \
            --caso "${{ inputs.caso }}" \
            --prompt "${{ inputs.prompt }}" \
            --documento "${{ inputs.documento }}"

      - name: Criar Pull Request com relatorios gerados
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- 'casos/**/analises/*.md' 'normas/manifest.json')" ]; then
            echo "Nenhum relatorio novo foi gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          short_sha="$(git rev-parse --short=12 HEAD)"
          branch="licitacoes-agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          git config user.name "licitacoes-agent"
          git config user.email "licitacoes-agent@users.noreply.github.com"
          git switch -c "$branch"
          git add -A -- casos normas
          git commit -m "docs: analises automaticas do commit ${short_sha}"
          git push origin "HEAD:${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: analises automaticas ${short_sha}" \
            --body "Relatorios gerados automaticamente para o commit \`${short_sha}\`. A publicacao depende de revisao e aprovacao humana."
