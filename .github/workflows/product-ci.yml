name: Motor de Atestados - CI

on:
  push:
    paths:
      - "motor_atestados/**"
      - "agente/**"
      - "conhecimento/**"
      - "schemas/**"
      - "tests/test_motor_atestados.py"
      - "tests/test_knowledge_repository.py"
      - "requirements-product.txt"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths:
      - "motor_atestados/**"
      - "agente/**"
      - "conhecimento/**"
      - "schemas/**"
      - "tests/test_motor_atestados.py"
      - "tests/test_knowledge_repository.py"
      - "requirements-product.txt"
      - ".github/workflows/product-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências do produto
        run: python -m pip install -r requirements-product.txt

      - name: Executar testes do produto
        run: python -m unittest discover -s tests -p "test_*atestados.py" -v && python -m unittest tests.test_knowledge_repository -v
